[project]
name = "knowledge-base-qa"
version = "0.1.0"
description = "ナレッジベース Q&A（RAG）— 資料を根拠に、出典を示して答える。LangChain + LangGraph + Claude + Jev"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "langchain-core",
    "langchain-anthropic",
    "langchain-chroma",
    "langchain-text-splitters",
    "chromadb",
    "fastembed",
    "pypdf",
    "typesafe-sdk",
    "langgraph>=1.2.17",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# プロンプトは日本語の文章なので行長チェックの対象外
"app/prompts.py" = ["E501"]
